name: CI

on:
  push:
    branches:
      - main
      - aeem-v2-foundation
  pull_request:
    branches:
      - main
      - aeem-v2-foundation

concurrency:
  group: aeem-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test live inquiry API
        run: node scripts/test-e2e-api.mjs

      - name: Test Edge Function logic
        run: node scripts/test-edge-functions.mjs

      - name: Test submit-inquiry handler (CORS and dedupe key)
        run: node scripts/test-submit-inquiry-handler.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck and build
        run: npm run build
